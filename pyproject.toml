[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anima"
version = "0.3.0rc2"
description = "Anima — 独立全智能 QQ 机器人（OpenClaw 式运行时 + Anima 认知内核）"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Anima" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.1",
    "bilibili-api",
]

[project.optional-dependencies]
# P1 QQ 对接
qq = ["websockets>=12.0", "aiohttp>=3.9", "Pillow>=10.0"]
# 向量库（P2/P3）
vector = ["aiosqlite>=0.20", "sqlite-vec>=0.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6"]
sylann = ["sylanne-core==2.5.0"]
# 受限本地文档文本提取；不包含 OCR/外部转换器。
docs = ["pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1"]

[project.scripts]
anima = "anima.cli:main"

[tool.setuptools.packages.find]
include = ["anima*"]

[tool.setuptools.package-data]
"anima.webui" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
