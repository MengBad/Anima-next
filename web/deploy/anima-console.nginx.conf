# Anima Console 反向代理 (Nginx)
# ---------------------------------------------------------------------------
# 放置：/etc/nginx/sites-available/anima-console
# 启用：ln -s /etc/nginx/sites-available/anima-console /etc/nginx/sites-enabled/
# 测试：nginx -t
# 重载：systemctl reload nginx
#
# 证书：
#   - 自签名（无域名）：openssl req -x509 -newkey rsa:2048 -nodes \
#       -keyout /etc/ssl/private/anima-console.key \
#       -out /etc/ssl/certs/anima-console.crt -days 365 -subj "/CN=anima-console"
#   - 有域名：用 certbot --nginx -d example.com 自动签发并注入。
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;   # 无域名用 _；有域名换成你的域名

    ssl_certificate     /etc/ssl/certs/anima-console.crt;
    ssl_certificate_key /etc/ssl/private/anima-console.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 可选：仅允许管理 IP（注释即允许全部）
    # allow 1.2.3.4;
    # deny  all;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
