  enabled: false
  max: 50
  model: ''
  recall_threshold: 0.8
danger:
  active_info_collection: true
  autonomous_web: false
  autonomous_web_extract_chars: 1500
  core_mutation: false
  core_mutation_confirm: false
  enabled: false
  identity_crisis: false
  info_collection_can_speak: false
  memory_infection: false
  memory_infection_confirm: false
