  relationship_inference: true
  self_improvement: false
  self_improvement_confirm: false
  self_improvement_cooldown_sec: 3600
  self_improvement_failure_window_sec: 7200
  self_improvement_max_recent_failed: 3
  self_improvement_max_running: 2
  self_improvement_min_intensity: 0.7
  self_improvement_skip_when_faults: true
  self_improvement_synth_prob: 0.1
  stance_max_age_seconds: 300
  stance_propagation: false
  stance_propagation_confirm: false
iteration:
  auto_repair: false
  auto_repair_cooldown_sec: 3600
  auto_restart: true
  daily_quota: 1
  enabled: true
