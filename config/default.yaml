# Anima 默认配置（设计冻结 v3.3）
# 所有决策默认值已编码；可被环境变量覆盖：ANIMA_LLM_API_KEY / ANIMA_LLM_ENDPOINT

qq:
  enabled: true                            # staging 设为 false 时不连接 NapCat、不处理 QQ 消息
  napcat_ws_url: "ws://127.0.0.1:3001"   # NapCat 反向 WS（同机默认）
  napcat_http_url: "http://127.0.0.1:3001" # NapCat HTTP API（用于发送/上传文件）
  self_id: null                           # 机器人 QQ 号（启动后可自动获取）
  access_token: ""                         # NapCat 鉴权 token
  event_concurrency: 12                    # 同时处理的长业务事件上限
  max_pending_events: 128                  # 高峰时的等待任务上限
  known_bot_ids: [486159181, 838916454, 3852906976]   # 其他 bot 的 QQ（UID 权威集；昵称不作为判定依据）
                                          # 486159181 = Aki/沙琪玛
                                          # 838916454 = 群 727631526 的 owner「丰川刻子」，owner 坐实账号本身就是 bot
                                          #   （🔴 我曾据昵称启发式判其为真人、建议排除，被 owner 纠正：
                                          #    昵称永远不能反推身份，UID 必须 owner 逐条坐实）
                                          # 3852906976 = 昵称 '1'／群名片「网友莉顺卡」，owner 确认是 bot 账号
                                          # 注：bot 发现开关在 social 段（bot_discovery_enabled）

llm:
  endpoint: "https://api.openai.com/v1"
  api_key: ""                             # 或 ANIMA_LLM_API_KEY
  model: "gpt-4o-mini"
  embedding_endpoint: null                # null 表示同 endpoint
  embedding_model: "text-embedding-3-small"
  embedding_dim: 1536
  timeout: 60.0
  retries: 2                               # 仅超时、429、5xx 时重试；鉴权错误不重试
  retry_backoff_sec: 0.6
  fallback_models:                         # 同网关备用模型（主模型瞬态失败时切换）
    - "gemini-3.6-flash"
    # 🔴 不列 `gemini-3-flash`：2026-10-05 生产 72h 账本实测 **36 次调用 0 次成功**
    # （全部 empty_completion，成功率 0%）。它排在链末位，只在「主模型 + 健康备用都失败」
    # 时才被调用，而那时它必然再失败一次 ⇒ 唯一效果是把"一次失败"变成"两次失败"
    # （多 3–6s），错误信息与失败模型数都不变。**纯开销，不含容灾价值。**
    # 代码侧同样硬拦（`anima/llm/__init__.py::_DEAD_FALLBACK_MODELS`），
    # 即使这里误加也不会进降级链。健康替代：`gemini-3.6-flash`（99% 成功率）。
  # 🔴 异族兜底（2026-10-06）：同 provider 的"200-空"是**上游整体抖动**，换同族模型救不回来
  # （72h 实测：主模型 100% 健康，而降级两级都在 google；00:25 事故即此形状）。
  # 所以链尾追加**一档异族** provider 的模型兜底。留空 ⇒ 行为与从前逐字相同。
  # 最多生效 1 档（链长上限 4 → 5）。同样受 `_DEAD_FALLBACK_MODELS` 硬拦。
  extra_fallback_models: []                 # 示例：["claude-opus-5-5-high", "kimi-k3"]
  circuit_failure_threshold: 3             # 连续可恢复失败后短暂熔断
  circuit_cooldown_sec: 30
  # 模块级模型路由：为特定子系统覆盖 llm.model，键是模块名（见 anima/llm/__init__.py 的
  # scoped_llm / module_models 与 WebUI「模型控制中心→模块模型路由」）。留空继承默认模型。
  # 示例：让 SelfCode 工程代理用中转站的 DeepSeek-V4-Flash-AMD。
  #   module_models:
  #     selfcode: "DeepSeek-V4-Flash-AMD"
  #   providers:
  #     amd:
  #       label: "AMD 中转站"
  #       endpoint: "http://127.0.0.1:8317/v1"
  #       api_key: ""                      # 中转站 Bearer
  #       model: "DeepSeek-V4-Flash-AMD"
  #   active_provider: "amd"
  module_models: {}
  providers: {}
  active_provider: "default"
  # 模块级 reasoning 档位（2026-10-02 新增）：键是模块名，值是 minimal/low/medium/high。
  # 🔴 只对 **gemini 系** 模型下发 —— 该参数是拿 gemini 网关实测标定的，对不认识的模型
  #    硬发可能 400（把一次可选优化变成一次故障），所以代码里先判 family 再发。
  # 🔴 写在这里的值会**覆盖**代码内默认表；留空（或删掉本键）即只用代码默认。
  #    代码默认（`anima/llm/__init__.py::_DEFAULT_REASONING_EFFORT`）已给
  #    `sticker_label` / `vision` 配 minimal。
  # 示例：module_reasoning_effort:
  #         selfcode: low
  #         crossgroup: minimal

vector:
  enabled: true
  db_path: "data/anima.db"
  embedding_backend: "remote"             # 远程 OpenAI 兼容（已定）；local 仅预留
  cache: true                             # hash→向量缓存

autonomy:
  enabled: true                           # owner 可一键 false 暂停自主发言
  heartbeat_tick_sec: 30.0
  cooldown_sec: 90                        # 每群/私聊冷却
  daily_max_per_group: 20                 # 每日自主条数/群（含议程）
  ratio_max: 0.30                         # 占群发言比上限
  token_budget_per_day: 0   # 0 = 不限额
  # —— quiet_hours 免打扰时段（通用，独立于 sleep 睡眠模式）——
  # 命中时段时非点名/非@被动消息静默跳过；点名/@/私聊默认豁免仍回。
  quiet_hours_enabled: false
  quiet_hours_start_hour: 23              # 含，跨午夜窗口（默认 23:00-07:00）
  quiet_hours_end_hour: 7                 # 不含
  quiet_hours_allow_direct: true          # 点名/@/私聊是否豁免（默认豁免=仍回）
  active_reply_prob: 0.08                 # 通过全部门控后实际主动开口的概率
  active_silence_min_sec: 300             # 人类消息沉默多久后才考虑插话
  active_global_cooldown_sec: 900         # 两次主动发言的全局最小间隔，防止复读刷屏
  active_min_group_messages: 6           # 群内积累的人类消息不足时绝不主动插话
  active_daily_max_per_group: 5          # 每群每天最多几次非议程主动发言
  active_context_score_threshold: 0.40    # 近期上下文有明确接话点才调用 LLM
  familiar_reply_min: 0.35                # familiar 群策略下的亲密度门槛
  wake_session_ttl_sec: 60                 # 被@/回复/喊名后窗内可自然续话的时长（秒），调短可降连环刷屏
  passive_reply_cooldown_sec: 45           # 每用户被动回复冷却（秒）：刚回过又未点名时跳过，0=关
  correction_exempt_cooldown: true         # 唤醒窗内命中纠正/补充词（"不对，我说的是X"）时豁免上述冷却
  active_intent_max_attempts: 5           # 主动意图连续失败后标记 failed
  active_feedback_window_sec: 900         # 主动消息后 15 分钟内有人继续互动视为获得反馈
  active_feedback_min_samples: 4          # 至少积累这些样本才自动按接受度降频
  active_feedback_min_acceptance: 0.20    # 接受度低于该值时暂停该群非议程主动接话

drift:                                    # 人格漂移幅度上限（§15.3）
  delta_max: 0.10                         # 单次单参数增量
  daily_budget: 1.5                       # 每日 general 池（≈30×0.05）
  self_correction_daily_budget: 0.5       # 自我修正独立池（≈10×0.05）
  window_ceiling: 4.0                     # 7 日滚动累计上限（≈2.7×日 general；两池合计）
  similarity_floor: 0.75                  # 相对人格锚点的相似度下限（Jaccard 自适应）
  valence_min: -0.30                      # 笔记情绪价态下限
  valence_max: 0.70                       # 笔记情绪价态上限
  checkpoints_keep: 7                     # persona 快照保留份数

permissions:
  owners: []                              # 主人 QQ 号
  admins: []
  readonly: []
  banned: []
  readonly_groups: []                      # 只读群号列表
  banned_groups: []                        # 静默群号列表
  group_policies: {}                      # 群号 -> {autonomy: bool, tools: [...]}

persistence:
  data_dir: "data"
  use_sqlite: true                        # 引入 aiosqlite（向量库需要）

compat:
  astrbot_enabled: false
  astrbot_tier: 1                         # 本期 compat 层覆盖到 Tier 1

crossgroup:                               # G1：跨群记忆 + 群氛围差异化
  enabled: true                           # 总开关
  observe_all_messages: true              # 对所有入站消息观察氛围/抽事实（前置到回复闸门前）
  min_fact_text_len: 6                    # 事实抽取最小文本长度（过滤 "666"/emoji）
  extraction_model: ""                    # 事实抽取模型；空=复用 llm.model
  max_facts_per_user: 50                  # 单用户事实上限（FIFO 截断防膨胀）

tool_learning:                             # P0：工具调用自学习
  enabled: true                           # 总开关
  summarize_interval: 10                  # 同工具成功记录每累计 N 条归纳一次规律
  records_max: 200                        # records 环形上限
  inject_top_k: 4                         # 注入 system 的使用心得条数

reply_learning:                            # P0-b：被动回复效果自学习（B1：只采集，不接闸门）
  enabled: true                           # 注入 + 归纳开关（采集与统计恒开）
  window_sec: 300                         # 开口后多久内有人接话算「被接住」
  records_max: 200                        # 每群心得环形上限
  inject_top_k: 3                         # 注入 system 的心得条数
  min_samples: 5                          # 少于这么多开口样本不归纳

capabilities:                              # P1：个人能力自生长系统
  enabled: true                           # 总开关
  initial_confidence: 0.3                 # 新建能力基线置信度（脱钩 LLM 自评）
  auto_register_confidence: 0.65          # 参考阈值（实际注册走 value_score 晋升）
  dynamic_daily_quota: 8                   # 每日新注册能力工具上限（给命名候选留位）
  max_total: 40                           # 能力库硬上限
  unused_drop_days: 30                    # 未使用超此天数淘汰
  unused_decay_days: 14                   # 未使用超此天数降权
  dedup_text_threshold: 0.6               # 语义去重文本相似度兜底阈值
  min_create_text_len: 6                  # 能力内容最小长度（防碎碎念）

notes_compact:                             # 自我笔记压缩（止住 self_notes.md 无限膨胀）
  enabled: true                           # 总开关
  notes_max_keep: 300                     # 保留最近 N 行，超出部分 LLM 摘要归档
  compact_every_ruminations: 6            # 每 N 次反刍触发一次（低频，避免频繁 LLM 调用）
  compact_model: ""                       # 压缩模型；空=复用 llm.model

sticker:                                   # 表情包自收集系统
  enabled: true                           # 总开关
  auto_collect: true                      # 从群消息 image 段自动捡图存库（仅群聊，私聊不收集）
  collect_mode: "cooldown"                # cooldown | probability
  collect_probability: 0.30                # probability 模式每批图片的收集概率
  collect_cooldown_sec: 30                 # cooldown 模式同群最小收集间隔
  collect_min_interval: 3.0               # 同发送者收集最小间隔（秒），防刷屏
  max_stickers: 500                       # 表情库硬上限（环形淘汰最旧/最少用）
  label_throttle_per_user: 600            # 每发送者打标最小间隔（秒）
  label_model: ""                         # 打标模型；空=复用 llm.model
  phash_dedup: true                       # 收集时 pHash 感知哈希近似去重（乱序截帧/改色/加字视为同一张）
  phash_threshold: 20                     # pHash 汉明阈值（越低越严格）
  smart_select: true                      # 选图走 BM25+混合相似度+嵌入语义 加权随机（未配向量库自动退 BM25）
  require_owner_review: true               # 新图先入候选区；结合 self_review：判定明确的自动过审，拿不准的留给 owner
  self_review: true                        # 表情包自审查/自过审：AI 判定明确即自动入库可发
  natural_forget: true                     # 自然遗忘：旧且少用的表情自动腾位
  forget_age_days: 60.0                    # 超过该天数的旧表情才纳入遗忘候选
  forget_used_max: 2                       # 历史使用次数 <= 此值才算"少用/远"
  forget_last_used_days: 30.0              # 距上次使用超该天才算"已凉"
  pending_capacity: 200                    # 待审核池达到上限即暂停自动收集
  default_scope: "local"                  # local=来源群可用；public=跨群可用（仍受总开关约束）
  collect_allowlist: []                    # group:<群号> / user:<QQ号>；空=不限制
  collect_blocklist: []
  send_allowlist: []
  send_blocklist: []
  share_across_groups: false               # 默认不跨群复用表情素材
  recent_window: 4                         # 同群近期表情去重窗口
  gif_min_interval_sec: 1800               # 同群 GIF 最小发送间隔
  always_atmosphere:                      # 允许带图的群氛围（formal 群不带，避免刷屏）
    - humorous
    - casual

vision:                                    # 全量多模态视觉理解（真·看见图片）
  enabled: true                            # 总开关
  model: ""                                # 视觉理解模型；空=复用 llm.model
  max_inline_bytes: 2097152                # 单图转码后的上限（2MB，再压一档）
  max_source_bytes: 33554432               # 可获取的 QQ 原图上限（32MB）
  max_request_image_bytes: 3145728         # 一次 LLM 请求全部视觉帧总预算（3MB）
  max_dimension: 1280                      # 自动缩放后的最长边
  max_animation_frames: 3                  # GIF/WebP 动图的关键帧数
  describe_throttle_per_user: 600          # 后台描述任务每发送者最小间隔（秒）
  describe_on_inbound: false               # 入站即描述：带图消息一进来就后台描述（默认关；开启后群图不再只在「回复了才看」）
  comprehend_in_chat: true                 # 用户在聊天发图时，bot 当场看图并接话
  store_desc_to_memory: true               # 把图片一句描述存进对话记忆，供后续轮次忆起

image_generation:
  enabled: false                            # 仅 owner 调用；启用前确认网关 images/generations 可用
  model: "gemini-3.1-flash-image"           # 生图模型。优先级：llm.module_models.image_generation > 此字段。
                                            # 两者皆配时模块路由优先；此字段留空则回落模块路由或 llm.model（需为图像模型）
  fallback_models: []                       # 生图跨模型容灾：主模型遇 429/500 等可重试状态时依次尝试。
                                            # 支持两种格式：gemini-*（chat 端点）与含 imagine 的模型（/images/generations 端点）。
                                            # 示例：["grok-imagine-image", "grok-imagine-image-quality"]
  daily_limit: 0                            # 当日成功生成图片上限；0 = 不限制，仍受权限/审批约束
  max_output_bytes: 16777216                # 单张图片最大 16MB

audio:
  transcription_enabled: true                # 收到 QQ 语音时尝试转写；失败会明确降级
  model: ""                                  # 空=复用 llm.model
  max_bytes: 10485760                        # 单条语音最大 10MB
  throttle_per_user: 120                     # 同一用户最小转写间隔（秒）

reply_split:                                 # 拟人分段发送 + 拟真打字延迟
  enabled: true
  max_segments: 2                            # 单条回复最多拆成几段
  min_segment_len: 40                        # 单段最小字数
  max_segment_len: 90                        # 单段最大字数
  trigger_threshold: 150                     # 低于此字数不分段
  tail_merge_threshold: 15                   # 尾段低于此字数合并到前段
  delay_enabled: true                        # 段间拟真延迟
  delay_base: 0.4                            # 基础延迟（秒）
  delay_factor: 0.02                         # 每字延迟（秒/字）
  delay_jitter: 0.3                          # 随机抖动上限（秒）

debounce:                                    # 群聊消息防抖（合并连续输入）
  group_enabled: true
  group_wait_sec: 1.0                        # 等待后续消息的窗口（2026-10-03：2.0→1.0）
  group_max_wait_sec: 6.0                    # 最大等待时间
  adaptive: true                             # 按消息长度自适应等待
  short_msg_threshold: 10                    # 短句阈值（字）

soul:                                        # 灵魂能量槽（4 维情绪状态 EMA 平滑）
  enabled: true
  ema_alpha: 0.3                             # EMA 平滑系数
  persist_interval_sec: 60.0                 # 持久化间隔

gate:                                        # 轻重双模型前置判断
  enabled: false                             # 默认关闭
  model: ""                                  # 轻量判断模型；空=继承 llm.model
  timeout_ms: 500                            # 超时回退完整流程
  fallback_to_full: true                     # 超时/失败时走完整流程

qzone:                                       # QQ 空间说说
  enabled: false                             # 默认关闭
  daily_max: 2                               # 每天最多发几条
  cooldown_sec: 14400                        # 冷却 4 小时

qq_status:                                   # QQ 在线状态同步
  enabled: false                             # 默认关闭

voice:                                       # AI 语音消息 TTS
  enabled: false
  auto_probability: 0.1                      # 特殊场景自动触发概率

meme:                                        # 趣味图片互动
  enabled: false
  petpet_on_poke: 0.3                        # 被戳时摸头回去概率

bilibili_read:                               # B 站视频理解（字幕抓取 + 总结）
  enabled: true
  sessdata: ""                               # B 站 Cookie SESSDATA（字幕接口需登录态）
  bili_jct: ""                               # B 站 Cookie bili_jct
  summary_model: ""                          # 字幕总结模型；空=复用 llm.model
  max_subtitle_length: 4000                  # 字幕截断上限，防上下文溢出

sylann:
  enabled: false
  mode: "disabled"                  # disabled | shadow | active
  data_dir: "sylann"
  weight: 0.15
  engine_mode: "lite"               # Sylanne-Core: lite | pro | max
  assessor_enabled: true
  pel_core_enabled: true
  tick_sessions_limit: 32

skills:
  enabled: true
  dir: "skills"
  allow_prompt: true
  max_loaded: 32

conversation:
  # 私聊连续输入收束为一个语义回合；命令在收束前处理，群聊不启用。
  enabled: true
  wait_sec: 1.5
  max_wait_sec: 8.0
  natural_feedback_ack: false   # §17 反馈自然回话：识别到反馈时私聊主回复末尾追加一句轻量确认（默认关）

react:
  # P0-1 Memory-First：成员/事实类问题先查内部记忆、再考虑搜网；
  # 同时让记忆类工具在 schema 中排在 web_search 之前。改 false 即完全回滚到旧行为。
  memory_first: true
  # P2-3 时效兜底：用过联网/时效类工具、但最终回答完全没日期痕迹时追加一句时效声明。
  freshness_footer: true
  # 上游根本没给出任何东西（HTTP 200 + 空 content / 传输故障 / 熔断）时，
  # 出口前最多等这么久再要一次正文，仍空才出罐头话术。只在这条出站本来就要变成
  # 罐头话术时付出延迟，且只等一次；熔断剩余超过该预算时不等待。0 = 关闭（回滚点）。
  # 20.0（2026-09-25 由 6.0 抬上来）：实测 4/4 次「等 6s 再试」仍空，而静默实际
  # 持续 8–20s ⇒ 6.0 结构上不可能成功，是纯延迟；取观测窗上沿 20s。
  # 2026-10-03：出站桶已**连续两次整链失败**时不再等待（窗口性故障，白等）。
  upstream_patience_sec: 20.0
  # 单次工具调用的墙钟上限（秒）。旧值是硬编码 120s，放过了 102s 的 x_search
  # （整回合被拖死、同群用户排队 2 分钟）。默认 45s，覆盖 browser goto 30s +
  # click 15s 的内部串行最坏。
  # 🔴 保持 45 不动：抬高它会一起放松**所有**工具（10-02 事故同因）。
  tool_timeout_sec: 45.0
  # per-tool 超时覆盖（2026-10-15）。**默认空 = 全部走上面的全局值（零行为变更）**。
  #
  # 用途：工具耗时差异极大 —— `x_search` 实测 45–102s（浏览器冷启动 + goto30s +
  # 渲染 + 下载配图 + 视觉过滤），而 45s 全局上限下它**结构性超时**
  # （2026-10-15 审核实证：7 天唯一一次调用 `工具调用超时(45s) name=x_search`）。
  # 但抬高全局值会一起放松**所有**工具（10-02「同群排队 2 分钟零回复」事故同因）
  # ⇒ 正确做法是只给长任务开小灶。
  #
  # 🔴 本文件保持空 dict（与代码默认同源，守卫 test_tool_timeout_config_defaults_are_same_source
  # 的同类原则）；**生产 config.yaml 显式配**：
  #     tool_timeout_overrides:
  #       x_search: 75.0
  # 与 `x_search.py` 的 `_X_SEARCH_BUDGET_SEC=65` 配套：内部先于外部收口，
  # 保证超时能优雅返回原因码，而不是被硬掐。
  tool_timeout_overrides: {}
  # 整回合 ReAct 墙钟预算（秒）。单次工具上限只挡「一个工具卡死」，挡不住
  # 「多轮工具 + 多次 LLM 往返」的累计；超预算则带已得工具结果收口作答，
  # 给单回合持锁时间一个硬上界。
  # 🔴 默认 0 = 关闭（与代码默认同源，守卫 test_default_yaml_has_turn_deadline）。
  # per-tool 把 x_search 放到 75s 后，**生产 config.yaml 应显式配 90**，
  # 否则「x_search 75s + 多轮工具」仍可能让同群串行锁被持住过久（10-02 排队事故）。
  turn_deadline_sec: 0.0
  # 技能路由提示（2026-10-10，**默认关**）。
  # 动机：`skill_web_brief` 在能力模式下被排在工具清单**末位**（capability 卡恒前、
  # legacy 卡恒后，sort_by_priority 在能力分支不生效），实测 40 天 0 次调用；
  # 位置抬不动，只能在 system 里点名导流。
  # ⚠️ 开启后「联网检索」的默认路径会多一次整理 LLM 调用 ⇒ 属行为变更，默认关。
  # 目标工具不在工具面时自动不注入（fail-closed）。
  skill_route_hint:
    enabled: false
    skill: skill_web_brief
    # text: "要联网查外部资料时，用工具 `{skill}`（先检索再整理成带来源与时间的要点）。"

memory:
  # 长期记忆（事件→知识→行为模式；anima/memory/long_term.py）
  # P0-2：把 long_term 查询注入认知上下文，跨会话偏好/决策能被 QQ 主路径感知。
  long_term_context: true
  long_term_write: "preference"       # preference=仅偏好/决策句与 Owner 私聊；all=每条消息；off=只读不写
  hydrate_period_hours: 6.0           # 宪法记忆周期水合间隔（小时）；<=0 回退默认
  # P3-1 语义召回读路径。默认 false：要调远程 embedding（延迟 + 费用），
  # 只服务 Owner 主动查询（!anima os / WebUI 控制面），不进每条消息的认知注入热路径。
  # 关键词检索不依赖 embedding（且已修好中文分词），关掉不影响基本可用性。
  long_term_semantic: false
  long_term_semantic_max_candidates: 60   # 候选上限；超出的不扫，结果会如实报告漏扫量
  long_term_semantic_threshold: 0.35      # 余弦相似度阈值

debt_tracking:
  # P1-1 承诺追踪：「帮你查 / 明天提醒」进债账本，到点跟进。enabled=false 完全关闭。
  enabled: true
  keyword_only_mode: true      # 只走关键词漏斗，零 LLM 成本
  reminded_max: 3
  remind_interval_sec: 86400
  grace_hours: 48
  inject_to_cognition: true

memory_compression:
  # P1-2 记忆压缩：夜间低峰跑一次，衰减置信度 + 合并相似事实 + 淘汰超容。
  # enabled=false → 不做整理（已写入的 confidence/disputed 仍被读取侧尊重）。
  enabled: true
  sim_threshold: 0.85        # 高于此相似度才合并（difflib 字符比，保守防误并）
  max_facts_per_user: 30     # 超出按 (confidence, timestamp) 升序淘汰
  daily_decay: 0.99          # ≈70 天衰减到 0.5；disputed 免疫
  run_hour: -1               # -1=不限小时（挂在凌晨日切块，天然低峰）；改 3 则严格 03:00 窗口
  min_facts_to_llm: 40       # 低于此数不调 LLM 摘要（成本封顶）
  interval_sec: 86400

task_agent:
  # P2-1 多步 Agent 任务的 verify / replan / 并行策略（anima/agent/executor.py）
  verify_steps: true          # 步骤成功后按 Step.verify 判据独立验收（需 LLM，无 LLM 自动跳过）
  max_replans: 2              # 失败重规划上限；0 = 关闭（退回「一失败即终止」）
  parallel_steps: true        # 允许 planner 标记的 parallel_group 内部并发
  max_parallel: 4             # 单个并行批次最大步骤数

owner_browser:
  # P1-3 Owner 受控浏览器（复用 agent_tools.agent_browser 进常规 ReAct）
  enabled: true
  private_only: true          # 群聊不暴露：owner 在群里同样是 level 4，仅靠 min_level 挡不住
  allowed_actions: "navigate,extract"   # 默认只读取页面；click 之类改页面状态的动作需显式加

proactive:
  # P1-4 主动优先级队列：债/订阅异常/健康 > 闲聊主动（注册表 core/proactive.py）
  enabled: true
  subscription_failure_threshold: 3   # 连续失败 3 次才提醒，避免抖动打扰
  subscription_anomaly_cooldown_sec: 21600
  urgent_threshold: 0.7
  source_priority: {}                 # 可选：按来源覆盖，如 heartbeat: 0.1

context:
  # 请求前上下文预算：人格、身份护栏和本轮用户输入不可裁，最旧历史/低优先级
  # 认知片段优先退出。不同模型 tokenizer 不同，数值是保守的防溢出阈值。
  input_token_budget: 12000
  system_token_budget: 8000
  image_token_estimate: 768
  tool_result_token_budget: 1800

  answer_length_budget:                  # 求答轮次「说多少」（2026-10-08）
    # 🔴 默认 **false** —— 不开则与从前逐字相同（零行为变更）。
    # 背景：`max_tokens` 在本项目上游（CPA 代理）**被完全忽略**（实测 16 → 6421 字），
    # 而 system 里的字数指令实测精准生效（150 → 117 字；生产人格下同样成立）
    # ⇒ 这是目前唯一可用的长度旋钮。
    # 触发：`_user_asked_question` 为真 **且** 用户没说要详细（`_user_wants_substantive`）。
    enabled: false
    budget_chars: 200                    # 求答回答的字数预算（150 会丢细节，200 为实测折中）
    exclude_when_user_wants_detail: true # 用户说「详细讲讲」时不注入（否则会被压死）

exploration:
  # 自主读取公开信息并形成带来源的知识笔记。外部内容一律视为不可信资料，
  # 不登录、不评论、不点赞、不执行网页指令。分享仍走 Agenda 与群级频控。
  enabled: true
  interval_sec: 3600
  daily_limit: 3                         # 当日探索次数上限；0 = 不限制（与 image_generation.daily_limit 同义）
  min_desire_intensity: 0.4
  sources:
    - bilibili_popular
    - bbc_zhongwen
    - bilibili_search                   # 仅具体好奇问题触发；公开视频元数据
    - wikipedia_zh                      # 仅具体好奇问题触发；百科只作知识线索
  novelty_window_sec: 604800
  max_notes: 200
  share_enabled: false                  # 先自主学习；Owner 验证后再允许主动分享
  daily_share_limit: 1                  # 当日外发分享条数上限；0 = 当天完全不分享（fail-closed，注意与 daily_limit 语义相反）
  share_min_score: 0.75                 # value_score 低于此值不外发
  share_groups: []                      # 空=仅沿欲望来源群；非空=额外限制可分享群（白名单）

self_code:
  enabled: false                             # 高危能力：仅 owner 显式开启；候选必须进入 WebUI/QQ 审批
  claude_executable: "claude"                # Claude Code CLI；不可用时可用 native 后端复用 bot LLM
  anthropic_api_key: ""                      # 留空则读环境变量 ANTHROPIC_API_KEY
  api_base_url: ""                           # 可选自定义端点
  workspace_dir: ""                          # 隔离工作区；空 = data_dir/selfcode_workspace
  selfcode_dir: ""                           # 安装目录；空 = data_dir/selfcode，不修改源码包
  max_turns: 12
  timeout_seconds: 180
  permission_mode: "acceptEdits"             # default | acceptEdits | plan | dontAsk
  auto_install: false                        # 兼容旧配置；运行时始终要求 Owner 审批
  daily_quota: 0                             # 0 = 不限制候选生成次数；不绕过超时/并发/审批
  test_timeout: 30
  model: ""                                  # 空 = 复用 llm.model
  max_review_rounds: 2
  critic_enabled: true
  coder_backend: "native"                  # auto | claude | native
                                           # auto：检测到 claude 二进制优先用 Claude Code，否则回落 native。
                                           # claude：强制走 Claude Code CLI（需配 anthropic_api_key 或登录）。
                                           # native：直接用 bot 的 LLM 生成模块（零外部依赖，最稳）。
                                           # 若用 native 并指定模型，配 llm.module_models.selfcode 或本块的 model。
  coder_retries: 4                       # 原生 coder/critic 最大尝试次数；LLM 异常或未出代码块时退避重试，慢慢跑
  coder_retry_delay: 5.0                 # 重试基础退避秒数，线性递增（attempt*delay）

proxy_mgmt:
  enabled: true                            # WebUI 代理节点管理（owner 鉴权 + 仅本机控制器）
  controller_url: "http://127.0.0.1:9090"  # mihomo 外部控制器
  config_path: "/usr/local/share/mihomo/config.yaml"
  subscription_timeout: 30                 # 订阅下载超时（秒）

webui:
  # 默认关闭且只监听本机；若改为非回环地址，必须设置 token 并通过反向代理加密。
  enabled: false
  host: "127.0.0.1"
  port: 8088
  token: ""

security:
  require_approval_for_danger: true         # danger 工具先生成 owner 审批单，批准前绝不执行
  approval_ttl_sec: 900                     # 审批单有效期（秒，30-86400）

deploy:
  mode: "systemd"                         # systemd | bare
  napcat_topology: "same-host"            # 同机默认；可选 separate-host

persona:
  typo_probability: 0.03                   # 错别字触发概率
  quirk_probability: 0.04                  # 发癲基础概率
  quirk_daily_max: 3                       # 每日发癲上限
  seed_relations: []                       # 种子关系（生产环境配置真实数据，源码不内嵌）
  # 示例：
  # seed_relations:
  #   - qq: 123456789
  #     name: "昵称"
  #     stage: "CLOSE"          # STRANGER | FRIEND | CLOSE
  #     familiarity: 0.9
  #     trust: 0.95
  #     valence: 0.7
  #     tags: ["开发者", "主人"]

# ---------------------------------------------------------------------------
# 以下段此前在 default.yaml 中**缺失**（债 D-06）。它们在代码里有默认值，所以
# 运行时不受影响；但缺段会让「仓库默认」与「生产实配」的键集无法对齐
# （deploy/check_config_drift.py 依赖这份键集做参考）。
#
# 补齐原则：**只补形状、不改值** —— 值一律取 AnimaConfig 的代码默认。
# 校验：`tests/test_default_yaml_completeness.py` 会断言此处每个段都在、
# 且 load_config('config/default.yaml') 与补齐前逐字段一致。
# 补齐日期：2026-09-18
# ---------------------------------------------------------------------------
capability_layer:
  capability_gateway_mode: false
  capability_mode: false
  governance_audit_enabled: false
  governance_data_dir: governance
  health_evidence_enabled: false
  pilot_capability_allowlist: []
