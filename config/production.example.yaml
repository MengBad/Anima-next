# =============================================================================
# Anima 生产配置 —— 脱敏模板（NOT a live file）
# =============================================================================
#
# 用途
#   让「生产实配」第一次进入版本控制，且不泄露任何密钥/个人标识。
#   生产真源是服务器上的 /opt/anima/config.yaml（**仍不入库**，见下"为什么"）。
#
# 为什么生产 config.yaml 不入库
#   2026-09-18 实测：生产 config.yaml 内**明文**存有 6 处密钥 ——
#     llm.api_key(48) · vector.embedding_api_key(51) · vector.rerank_api_key(51)
#     · webui.token(40) · tavily.api_key(58) · x_browser.password(13)
#   直接追踪会把它们写进 git 历史；而本机 git 历史已丢失两次、远程是唯一第二副本。
#
# 历史事故（本文件存在的理由）
#   `.gitignore:11` 忽略 config.yaml ⇒ 生产是「服务器手工件」，与仓库 config/default.yaml
#   是两个真源。后果：治理文档连续三处写「能力治理默认全 OFF / never flipped to True」，
#   而生产实际把 capability_mode / capability_gateway_mode / governance_audit_enabled /
#   python_exec_enabled **四项全设为 true**，长期无人发现（2026-09-18 审查 P0-2 / P0-3）。
#   **任何"开关状态"结论必须读生产文件，不能读代码默认值、也不能读文档。**
#
# 本文件怎么用
#   1) 人类查阅：生产覆盖了哪些键、哪些键是生产独有。
#   2) 机器检查：`python deploy/check_config_drift.py`
#      以「config/default.yaml ∪ 本模板」为参考，报告生产侧**未登记**的键（应恒为 0）、
#      生产显式为 true 的开关面、以及疑似明文密钥。
#   3) 值一律以占位符表示；本文件承担**键集与开关面**，不承担值比对。
#
# 生成依据：2026-09-18 生产 /opt/anima/config.yaml（mtime 2026-09-17 07:48:31，9766 B）
#           掩码导出后与仓库 config/default.yaml 做结构差异得出。
# 动态键约定：`permissions.group_policies` 以群号为键，条目数随运营变化，
#           漂移检查对该前缀做通配归约（`<id>` → `*`），模板只需给一个样例形状。
# =============================================================================

# ---------------------------------------------------------------------------
# 密钥：优先全部走环境变量（load_config 支持注入，见 anima/core/config.py:1019-1032）
# ---------------------------------------------------------------------------
# 已支持 env 注入的键（生产目前仍是明文写在 yaml 里 —— 建议迁移，需 owner 决定）：
#   ANIMA_LLM_API_KEY         -> llm.api_key
#   ANIMA_LLM_ENDPOINT        -> llm.endpoint
#   ANIMA_EMBEDDING_API_KEY   -> vector.embedding_api_key
#   ANIMA_RERANK_API_KEY      -> vector.rerank_api_key
#   ANIMA_TAVILY_API_KEY      -> tavily.api_key
#
# 🔴 无 env 注入通道的密钥（无法只靠配置外置，需要代码改动）：
#   webui.token       —— 生产为明文 40 字符。台账 D-07。
#   x_browser.password—— 生产为明文 13 字符。台账 D-07。

llm:
  api_key: "<ANIMA_LLM_API_KEY 或明文占位>"
  endpoint: "<your-openai-compatible-endpoint>"   # 生产为自建 CPA 端点
  model: "gemini-3.8-flash-high"
  model_prices: {}
  module_models:
    image_generation: "gemini-3.1-flash-image"
    selfcode: "DeepSeek-V4-Flash-AMD"

vector:
  embedding_api_key: "<ANIMA_EMBEDDING_API_KEY>"
  embedding_endpoint: "<your-embedding-endpoint>"
  embedding_model: "BAAI/bge-m3"
  embedding_dim: 1024
  rerank_api_key: "<ANIMA_RERANK_API_KEY>"
  rerank_endpoint: "<your-rerank-endpoint>"
  rerank_model: "BAAI/bge-reranker-v2-m3"
  rerank_enabled: true
  rerank_top_n: 5

webui:
  enabled: true
  host: "0.0.0.0"
  token: "<REDACTED —— 生产为明文，无 env 通道>"

qq:
  self_id: 0                  # 生产填真实 bot QQ
  access_token: null
  known_bot_ids: []
  typing_indicator: true

permissions:
  owners: [0]                 # 生产填真实 owner QQ
  admins: [0]
  banned: []
  banned_groups: []
  readonly: []
  readonly_groups: []
  # 动态键：按群号配置。生产实有 2 个群，字段形状如下（数值以实际为准）。
  group_policies:
    "0":                      # ← 群号占位；漂移检查做通配归约
      autonomy: true
      familiar_min: 0.95
      reply_mode: "familiar"

# ---------------------------------------------------------------------------
# 🔴 能力治理开关（本模板存在的**主要原因**）
# ---------------------------------------------------------------------------
# 代码默认值全部 false（anima/core/config.py:261-305 CapabilityLayerConfig）。
# 生产实测（2026-09-18）：下列四项已为 true。
# Owner 于 2026-09-18 确认这些翻转**经其授权**；代码亦留痕
# （`anima/tools/__init__.py:193`「R5 PHASE 13 re-open (owner-authorized 2026-08-15)」）。
# 翻转**未走** config_service / config_recovery ⇒ 生产无 config_changes.json /
# config_backups，时间点与操作者不可从服务器自证；仅能由最早路由事件反推上界
# （≤ 2026-09-05 13:48，见 reports/2026-09-18_phase_a_honesty_pass.md A2 节）。
capability_layer:
  capability_mode: true                  # ① 能力路由总开关
  capability_gateway_mode: true           # ② 受治理 Gateway（Line B）
  governance_audit_enabled: true          # ③ Resolution 审计链落盘
  python_exec_enabled: true               # ④ 🔴 governed python.exec 注册与可达
  governance_data_dir: "governance"       # 解析为 <data_dir>/governance
  pilot_capability_allowlist: []          # 空 = 拒绝全部「pilot-only」路由（fail-closed）
  health_evidence_enabled: false
  transition_audit_enabled: false
  python_exec_permission_level: 2
  python_exec_require_audit: true

# ⚠️ 关于 ④ + 空 allowlist 的**易误读点**（2026-09-18 实测订正）：
#   空 `pilot_capability_allowlist` **挡不住 python.exec**。
#   pilot allowlist 门只作用于 `capability_only=True` 的 provider
#   （anima/tools/__init__.py:977-979），而 python.exec 的 provider 不是
#   capability_only（同文件:194-195 明写「不经 pilot allowlist 门，直达
#   _governed_capability_route」）⇒ 它的实际门是 gateway.handle 内四道
#   fail-closed 门（kill_switch / grant / audit_sink / isolator）+ provider 的
#   **owner-only** 边界，而前两门在代码里以 `kill_switch=False, grant=True`
#   构造（tools/__init__.py:607-609）。
#   结论：**owner 主体在生产可通过受治理路径调用 python.exec。**
#   实测使用量 = 0（resolution 事件 16 条全为 search.web；审计/日志 0 命中）。

