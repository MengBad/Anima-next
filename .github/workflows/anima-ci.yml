name: ANIMA CI

on:
  push:
    branches: [master, anima-autonomous-evo]
  pull_request:
    branches: [master, anima-autonomous-evo]

# 安全纪律：CI 仅有读取与验证逻辑，绝不持有生产部署凭证，绝不自动批准 Evolution。
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: anima-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史以计算 merge-base 供安全护栏对比
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[qq,vector,dev,docs,sylann]"
          pip install pytest-cov pytest-json-report
      - name: Run tests with coverage + json report
        run: |
          python -m pytest tests/ \
            -q --cov=anima --cov-report=term-missing \
            --json-report --json-report-file=test-result.json
      - name: Upload test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result.json
          if-no-files-found: ignore

  # Frontend (build) job 随 WebUI 整体移除而删除（design §5.5）。

  security:
    name: Security guard (CORE_PROTECTED / sensitive paths)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run security guard
        run: python scripts/anima_guard.py --base origin/master --out security-report.json
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.json
          if-no-files-found: ignore
      - name: Surface owner-review requirement
        if: always()
        run: |
          python - <<'PY'
          import json
          try:
              r = json.load(open("security-report.json"))
          except Exception:
              r = {}
          if r.get("requires_owner_review"):
              print("::warning::触碰核心/安全代码，需 Owner 审查后方可合并/部署：", r.get("core_protected_touched"))
          PY

  evidence:
    name: CI evidence aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Aggregate evidence
        run: |
          if [ -f artifacts/test-result/test-result.json ]; then cp artifacts/test-result/test-result.json ./test-result.json; fi
          if [ -f artifacts/security-report/security-report.json ]; then cp artifacts/security-report/security-report.json ./security-report.json; fi
          # WebUI 已整体移除（design §5.5），前端构建不再是证据链的一环。
          python scripts/ci_evidence.py \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --security-report security-report.json \
            --test-report test-result.json \
            --out-ci ci-report.json --out-attest commit-attestation.json
      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            ci-report.json
            commit-attestation.json
            security-report.json
          if-no-files-found: ignore
